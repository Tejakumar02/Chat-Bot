name: keep-supabase-alive

on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to keep it active
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # strip any whitespace/newlines/carriage returns picked up from copy-paste
          SUPABASE_URL=$(echo -n "$RAW_URL" | tr -d '[:space:]')
          SUPABASE_KEY=$(echo -n "$RAW_KEY" | tr -d '[:space:]')

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "❌ One or both secrets are empty after sanitizing"
            exit 1
          fi

          echo "URL length: ${#SUPABASE_URL} chars"
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/messages?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"